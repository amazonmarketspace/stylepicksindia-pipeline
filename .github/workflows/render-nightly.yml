name: render-nightly
on:
  workflow_dispatch:

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu
      - name: Install Python deps
        run: pip install pyyaml pillow edge-tts google-api-python-client google-auth-oauthlib

      - name: Reset stuck rows
        env:
          GSHEET_ID: ${{ secrets.GSHEET_ID }}
          GOOGLE_CREDS: ${{ secrets.GOOGLE_CREDS }}
          GSHEET_TAB: "StylePicksIndia"
        run: python3 src/reset_sheet.py || true

      - name: Scrape fresh products (need 80+ for 10 videos)
        env:
          GSHEET_ID: ${{ secrets.GSHEET_ID }}
          GOOGLE_CREDS: ${{ secrets.GOOGLE_CREDS }}
          GSHEET_TAB: "StylePicksIndia"
          DAILY_NEW_TARGET: "100"
        run: python3 src/scrape_products.py

      - name: Render long_1 (6am)
        env:
          GSHEET_ID: ${{ secrets.GSHEET_ID }}
          GOOGLE_CREDS: ${{ secrets.GOOGLE_CREDS }}
          GSHEET_TAB: "StylePicksIndia"
          BATCH_SLOT: "long_1"
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
          DRIVE_REFRESH_TOKEN: ${{ secrets.DRIVE_REFRESH_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
        run: |
          python3 src/from_sheet.py && python3 src/build.py && python3 src/narrate.py
          python3 src/render.py --format long && python3 src/save_to_drive.py --slot long_1

      - name: Render short_1 (8am)
        env:
          GSHEET_ID: ${{ secrets.GSHEET_ID }}
          GOOGLE_CREDS: ${{ secrets.GOOGLE_CREDS }}
          GSHEET_TAB: "StylePicksIndia"
          BATCH_SLOT: "short_1"
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
          DRIVE_REFRESH_TOKEN: ${{ secrets.DRIVE_REFRESH_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
        run: |
          python3 src/from_sheet.py && python3 src/build.py && python3 src/narrate.py
          python3 src/render.py --format short --max-shorts 1 && python3 src/save_to_drive.py --slot short_1

      - name: Render long_2 (10am)
        env:
          GSHEET_ID: ${{ secrets.GSHEET_ID }}
          GOOGLE_CREDS: ${{ secrets.GOOGLE_CREDS }}
          GSHEET_TAB: "StylePicksIndia"
          BATCH_SLOT: "long_2"
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
          DRIVE_REFRESH_TOKEN: ${{ secrets.DRIVE_REFRESH_TOKEN }}
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
        run: |
          python3 src/from_sheet.py && python3 src/build.py && python3 src/narrate.py
          python3 src/render.py --format long && python3 src/save_to_drive.py --slot long_2

      - name: Render short_2 (12pm)
