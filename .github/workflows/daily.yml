name: daily-video
on:
  schedule:
    - cron: '30 18 * * *'   # 00:00 IST — fires ~08:30 IST after GitHub delay
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }

      - name: Install system deps
        run: sudo apt-get update && sudo apt-get install -y ffmpeg fonts-dejavu

      - name: Install Python deps
        run: pip install pyyaml pillow edge-tts google-api-python-client google-auth-oauthlib

      - name: Reset any stuck in_progress rows
        env:
          GSHEET_ID: ${{ secrets.GSHEET_ID }}
          GOOGLE_CREDS: ${{ secrets.GOOGLE_CREDS }}
          GSHEET_TAB: "StylePicksIndia"
        run: python3 src/reset_sheet.py || true

      - name: Scrape fresh apparel products from Amazon India
        env:
          GSHEET_ID: ${{ secrets.GSHEET_ID }}
          GOOGLE_CREDS: ${{ secrets.GOOGLE_CREDS }}
          GSHEET_TAB: "StylePicksIndia"
          DAILY_NEW_TARGET: "40"
        run: python3 src/scrape_products.py

      - name: Pull today's batch from Google Sheet
        env:
          GSHEET_ID: ${{ secrets.GSHEET_ID }}
          GOOGLE_CREDS: ${{ secrets.GOOGLE_CREDS }}
          GSHEET_TAB: "StylePicksIndia"
        run: python3 src/from_sheet.py

      - name: Build affiliate links and scripts
        run: python3 src/build.py

      - name: Generate Hindi narration
        run: python3 src/narrate.py

      - name: Render long-form video
        run: python3 src/render.py --format long

      - name: Render 5 Shorts
        run: python3 src/render.py --format short --max-shorts 5

      - name: Upload to YouTube via API
        env:
          YT_CLIENT_ID: ${{ secrets.YT_CLIENT_ID }}
          YT_CLIENT_SECRET: ${{ secrets.YT_CLIENT_SECRET }}
          YT_REFRESH_TOKEN: ${{ secrets.YT_REFRESH_TOKEN }}
          GSHEET_ID: ${{ secrets.GSHEET_ID }}
          GOOGLE_CREDS: ${{ secrets.GOOGLE_CREDS }}
          GSHEET_TAB: "StylePicksIndia"
        run: python3 src/upload.py --privacy public --max-long 1 --max-short 5

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: video-output-${{ github.run_number }}
          path: out/*/
          retention-days: 3
